# Alert Rules Configuration
# Generated: 2026-08-11

alerts:
  - name: HighLatency
    severity: critical
    condition: latency_p95_ms > 3000 for 5m
    type: symptom-based
    owner: platform-team
    runbook: docs/alerts.md#high-latency
    sli: latency_p95_ms
    slo_target: 99.5%

  - name: HighErrorRate
    severity: critical
    condition: error_rate_pct > 2 for 3m
    type: symptom-based
    owner: platform-team
    runbook: docs/alerts.md#high-error-rate
    sli: error_rate_pct
    slo_target: 99.0%

  - name: LowQualityScore
    severity: warning
    condition: quality_score_avg < 0.75 for 10m
    type: symptom-based
    owner: ml-team
    runbook: docs/alerts.md#low-quality-score
    sli: quality_score_avg
    slo_target: 95.0%
